- target: $.info
  update:
    contact:
      name: Local Infusion
      url: https://mylocalinfusion.com/get-started/
    license:
      name: Proprietary — no published API terms
      url: https://mylocalinfusion.com/privacy-policy/
- target: $
  update:
    x-agent-access-posture:
      stance: permissive
      source: https://mylocalinfusion.com/robots.txt
      allowed_agents: [GPTBot, ChatGPT-User, PerplexityBot, ClaudeBot, anthropic-ai, Google-Extended]
      disallowed_agents: []
      note: >-
        The provider explicitly ALLOWS the major AI crawlers by name and asserts no opt-out anywhere on
        the host. It further publishes /llms.txt, /llms-full.txt and three .well-known agent-discovery
        documents that state claim boundaries in prose: no guaranteed outcomes, no medical advice, and
        no inferring that a medication is available at a given centre. Honour those boundaries — they
        are the provider's stated terms for agent use even though they are not machine-enforced.
- target: $.paths['/wp-json/wp/v2/location'].get
  update:
    x-apievangelist-use-case: >-
      The infusion-centre directory — 75 published records covering thirteen states, readable without
      credentials. Slugs are city-state. Paginate with page/per_page, read X-WP-Total and
      X-WP-TotalPages, and narrow the payload with _fields=id,slug,title,link. This is the one
      endpoint on this host worth an integration.
- target: $.paths['/wp-json/wp/v2/posts'].get
  update:
    x-apievangelist-use-case: >-
      The company blog — 73 posts including therapy launches and clinical-service announcements.
      Filter with categories/tags/after; use _embed to inline the featured image and author.
- target: $.paths['/wp-json/mcp/mcp-oauth-server'].post
  update:
    x-apievangelist-note: >-
      Live MCP JSON-RPC endpoint. Anonymous tools/list returns HTTP 401 with a correct RFC 9728 Bearer
      challenge; the tool set requires scope `mcp` via authorization_code + PKCE. Token endpoint auth
      is `none` and client_id_metadata_document is supported.
- target: $.paths['/wp-json/wp-abilities/v1/abilities'].get
  update:
    x-apievangelist-note: >-
      WordPress Abilities registry — the surface MCP tools are projected from. Gated (HTTP 401
      anonymously), so the ability names and input schemas behind the MCP servers are not publicly
      discoverable.
- target: $.paths['/wp-json/batch/v1'].post
  update:
    x-apievangelist-note: >-
      Request batching. `validation=require-all-validate` validates every sub-request before any
      executes. It is a pre-flight guard, not a transaction: there is no rollback once writes apply.
      See the reversibility block in conventions/local-infusion-conventions.yml.
