actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-08-25'
    x-apievangelist-surface-class: corporate-cms
    x-apievangelist-provider-type: outpatient-healthcare-services
    x-apievangelist-note: >-
      Local Infusion publishes no developer product API. This contract is the WordPress REST API of its
      corporate marketing site, derived from the live /wp-json/ discovery document. It is catalogued
      because it is a real, self-describing, provider-hosted HTTP surface that carries a genuinely
      useful public dataset (the 75-record `location` centre directory) and fronts two Model Context
      Protocol servers.
