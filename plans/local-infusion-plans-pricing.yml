summary: >-
  No plans, no tiers, no published price of any kind — for the API or for the service. The company's
  commercial model is insurance-billed clinical care: it states that it accepts most major plans
  (Anthem, Aetna, Cigna, United Healthcare, Medicare, Humana and regional payers) and promises
  financial transparency with no surprise bills, but publishes no rate, no self-pay price and no
  machine-readable pricing surface. Every commercial route on the site is a contact form.
