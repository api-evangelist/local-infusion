source: >-
  openapi/_original/local-infusion-wp-rest-openapi.yml and live probes of mylocalinfusion.com on
  2026-08-25. Searched for a versioning policy, deprecation policy, SLA and status page; none exists.
summary: >-
  There is no API lifecycle here because there is no API programme. Local Infusion has published no
  versioning policy, no deprecation policy, no SLA, no status page and no changelog for any machine
  surface. What lifecycle exists is WordPress's own, inherited by running the CMS.
versioning:
  style: namespace-in-path
  current: wp/v2
  policy_published: false
  policy_url: null
  note: >-
    WordPress versions its REST API by namespace segment. The host advertises 15 namespaces:
    oembed/1.0, redirection/v1, wordfence-login-security/v1, wordfence/v1, yoast/v1,
    block-visibility/v1, duplicate-post/v1, objectcache/v1, wp-rocket/v1, genesis/v1, mcp,
    wp/v2, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1. Ten of those are third-party plugin
    internals whose version cadence the provider does not control and does not document.
