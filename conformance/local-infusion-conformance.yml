summary: >-
  A short list, and the shape of it is the point. Local Infusion conforms to the OAuth/MCP discovery
  standards it inherited by installing a WordPress MCP adapter, and to nothing in its own market. It
  is a HIPAA-covered healthcare provider that publishes no FHIR surface, no SMART configuration and no
  security attestation.
standards:
- id: oauth2
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server returns RFC 8414 metadata (HTTP 200, 2026-08-25) declaring
    authorization_code + refresh_token, response_types [code], and PKCE S256 in
    code_challenge_methods_supported. Authorization, token and revocation endpoints are all named.
  file: well-known/local-infusion-oauth-authorization-server.json
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: /.well-known/oauth-authorization-server, HTTP 200, valid JSON object with issuer + endpoints.
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource returns HTTP 200 naming the resource
    (https://mylocalinfusion.com/wp-json/mcp/mcp-oauth-server), its authorization_servers,
    bearer_methods_supported [header] and scopes_supported [mcp]. The 401 from the MCP endpoint also
