aid: local-infusion
name: Local Infusion
description: >-
  Local Infusion is a tech-enabled outpatient infusion-therapy provider operating ambulatory infusion
  centers across thirteen US states — Connecticut, Florida, Maine, Maryland, Massachusetts, New
  Hampshire, New Jersey, New York, North Carolina, Ohio, South Carolina, Texas and Virginia — where
  patients with autoimmune, neurological, gastrointestinal and other chronic conditions receive
  specialty biologic infusions in private suites, supported by a dedicated Infusion Guide who handles
  referrals, prior authorization, benefits investigation and financial assistance. It sells care, not
  software: there is no developer programme, no product API, no SDK and no published pricing for any
  machine surface. It is catalogued here because its corporate WordPress site serves a live,
  self-describing REST API of 282 routes — including a publicly readable `location` custom post type
  carrying the company's 75-center directory — because the same install fronts two Model Context
  Protocol servers guarded by an OAuth 2.1 authorization server the host advertises through RFC 8414
  and RFC 9728 metadata, and because the site carries an unusually deliberate agent-discovery layer:
  llms.txt, llms-full.txt, and .well-known ai-manifest, brand-facts and llm-sitemap documents, with a
  robots.txt that explicitly allows GPTBot, ClaudeBot, PerplexityBot and Google-Extended.
