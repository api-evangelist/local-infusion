x-enrichment-notes: >-
  The harvest stub carried a Website pointer of https://www.nasdaqprivatemarket.com/ — a secondary-market
  venue listing, not the company. It has been corrected to https://mylocalinfusion.com/ (localinfusion.com
  and www.localinfusion.com both 301 there) and the venue URL demoted to type SecondaryMarket.
  Deliberately absent, each a verified negative on 2026-08-25: Idempotency (no Idempotency-Key in any of
  274 operations, none in Access-Control-Allow-Headers, WordPress core provides none); SDKs and any
  official package (nothing on npm, PyPI, RubyGems, crates.io, NuGet, Maven Central or the Go proxy, and
  no GitHub org under local-infusion or mylocalinfusion — both 404); StatusPage (status.mylocalinfusion.com
  NXDOMAIN); Deprecation (no policy, no RFC 8594 headers on any probed response); Security, SecurityTxt and
  TrustCenter (/.well-known/security.txt 404, no disclosure page, no bug bounty, trust.mylocalinfusion.com
  NXDOMAIN); Compliance (no SOC 2, ISO 27001, HITRUST or HIPAA attestation published; /hipaa/ and
  /notice-of-privacy-practices/ both 404); AgentCard (/.well-known/agent-card.json and
  /.well-known/agent.json both 404 — nothing written, per the search-only rule); AsyncAPI and Webhooks (no
  event surface; /asyncapi.json, /asyncapi.yaml and /webhooks all 404); GraphQL (/graphql 404); Sandbox,
  CLI, Components, ChangeLog, Postman, Roadmap, Pricing, SignUp, TermsOfService, DeveloperPortal,
  Documentation, APIReference, GettingStarted and Support (none exists — there is no developer programme,
  and the site has no terms-of-service page at /terms/ or /terms-of-use/, both 404). The MCP tool list is
  empty because tools/list is OAuth-gated on mcp-oauth-server and capability-gated on
  mcp-adapter-default-server, and the WordPress Abilities registry it projects from is gated too; nothing
  was inferred. repair-api-bases.py flags marketing-base-present on the derived servers[] block
  (https://mylocalinfusion.com) — that is a false positive here and was NOT changed: the derived paths all
  carry the /wp-json prefix, so the site root is the correct server, exactly as in all/a2-biotherapeutics.
