summary: >-
  Every /.well-known/ path in the pipeline's standard probe set was requested against the single host
  Local Infusion operates. Two returned real documents: RFC 8414 OAuth 2.0 authorization-server
  metadata and RFC 9728 OAuth 2.0 protected-resource metadata, both emitted by the WordPress MCP
  adapter that fronts the site's Model Context Protocol servers. security.txt, openid-configuration,
  api-catalog and ai-plugin.json all 404. Beyond the standard set the site serves three non-standard
  agent-discovery documents of its own — ai-manifest.json, brand-facts.json and llm-sitemap.json —
  which are linked from the homepage and from /llms.txt; those are captured here too because they are
  the provider's own machine-readable statements about how agents should read the site.
